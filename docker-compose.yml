# =============================================================================
# Hypostasia — docker-compose unique dev/prod
#
# Le comportement est determine par DEBUG dans .env. Le conteneur
# s'installe et se demarre SEUL dans les deux modes :
#   DEBUG=true  → bin/start-dev.sh   (runserver:8000, rechargement auto)
#   DEBUG=false → bin/start-prod.sh  (gunicorn:8001 + daphne:8000)
#
# Les deux appellent bin/install.sh, ou vit toute la sequence
# d'installation. Le site est sur le port 8000 en dev — PAS 8123 — et il
# y a TROIS workers Celery, dont un dedie a l'ingestion Docling a
# concurrence 1.
#
# CETTE STACK NE PREND AUCUN PORT DE L'HOTE
#
# Les ports 80 et 443 appartiennent au **Traefik partage** de la
# machine : celui qui detient le reseau `frontend` (declare
# `external: true` en bas de ce fichier) et qui definit le resolveur
# `myresolver` que les labels de nginx reclament. Notre nginx s'y
# inscrit par ses labels, et c'est tout.
#
# PREREQUIS : ce Traefik doit tourner AVANT cette stack, et le reseau
# `frontend` doit exister. Sans lui, les conteneurs demarrent tres bien
# mais rien ne repond sur le domaine : personne n'ecoute sur 80.
#
# Un service traefik a vecu ici jusqu'au 16 aout 2026. Il prenait
# 0.0.0.0:80 et :443 — donc la place du vrai — et ne definissait AUCUN
# resolveur de certificats alors que les labels en reclamaient un : le
# site ne repondait qu'en TLS auto-signe.
# / This stack claims NO host port: 80 and 443 belong to the machine's
# shared Traefik, which owns the `frontend` network and defines
# `myresolver`. It must be running first, or nothing answers.
#
# TOUT :
#   make install                        (ou : docker compose up -d)
#   make logs                           (ou : docker compose logs -f web)
#   make                                la liste des cibles
#
# TOUT REFAIRE DE ZERO :
#   docker compose down -v && make install
#   Une seule voie, donc aucun doute sur l'etat de la base.
#
# PROD — mise a jour :
#   make prod-update CONTENEUR=<nom>    (refuse si DEBUG=true dans .env)
# =============================================================================

services:
  postgres:
    image: postgres:17-alpine
    container_name: hypostasia_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hypostasia}
      POSTGRES_USER: ${POSTGRES_USER:-hypostasia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hypostasia}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - hypostasia

  redis:
    image: redis:7-alpine
    container_name: hypostasia_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - hypostasia

  web:
    build: .
    container_name: hypostasia_web
    # Utilise le meme uid:gid que l'utilisateur hote pour que les volumes
    # montes (media/, logs/, tmp/) soient accessibles en ecriture.
    # Par defaut 1000:1000 (premier user Linux). Surcharger dans .env si different.
    # / Uses the same uid:gid as the host user so that mounted volumes
    # / (media/, logs/, tmp/) are writable. Default 1000:1000 (first Linux user).
    # user: "${UID:-1000}:${GID:-1000}"
    env_file: .env
    environment:
      # Force le host PostgreSQL et Redis vers les noms de service Docker
      # / Force PostgreSQL and Redis hosts to Docker service names
      POSTGRES_HOST: postgres
      CELERY_BROKER_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
      # Fait taire les avertissements de graph break de torch.compile.
      # Docling fait compiler son modele de layout (RT-DETRv2) par
      # transformers ; un `Tensor.item()` casse le graphe, torch retombe
      # en mode eager et le CRIE sur 35 lignes. La conversion est juste,
      # seulement plus lente sur ce fragment — le bruit n'apprend rien et
      # noie la sortie d'installation.
      #
      # `-dynamo` monte CE SEUL logger a ERROR : un vrai plantage de
      # torch.compile resterait visible. Le reste des logs de conversion
      # (RapidOCR, docling) n'est pas touche.
      #
      # Une fois par process, pas par conversion : la 2e conversion d'un
      # meme worker n'emet plus rien (mesure du 15 aout 2026).
      # / Silences torch.compile graph-break warnings from Docling's layout
      # model. Raises only that logger to ERROR; real failures still show.
      TORCH_LOGS: "-dynamo"
      # Cache uv et home dans /app pour eviter les problemes de permissions
      # / uv cache and home in /app to avoid permission issues
      UV_CACHE_DIR: /app/.cache/uv
      HOME: /app
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hypostasia
    # DEBUG=true  → bin/start-dev.sh   (runserver:8000)
    # DEBUG=false → bin/start-prod.sh  (gunicorn:8001 + daphne:8000)
    #
    # Les deux scripts enchainent bin/install.sh puis leur supervisord.
    # La sequence de demarrage n'est PAS ecrite ici : ce fichier choisit
    # lequel des deux scripts lancer, rien de plus. Une commande ecrite
    # dans un YAML est une commande que personne ne peut tester.
    # / The startup sequence is not written here: this file only picks
    # which script to run.
    #
    # ATTENTION : `DEBUG` et `NGINX_CONF` vont ENSEMBLE. En dev,
    # runserver sert le HTTP et le WebSocket sur 8000 ; en prod, gunicorn
    # tient le 8001 et daphne le 8000. La conf de prod avec DEBUG=true
    # enverrait `/` sur 8001, ou personne n'ecoute : 502 sur tout le
    # site. / DEBUG and NGINX_CONF must move together.
    command: >
      bash -c '
        if [ "$DEBUG" = "true" ] || [ "$DEBUG" = "True" ]; then
          exec bash bin/start-dev.sh
        else
          exec bash bin/start-prod.sh
        fi
      '

  nginx:
    image: nginx:alpine
    container_name: hypostasia_nginx
    volumes:
      - ./nginx/${NGINX_CONF:-default.conf}:/etc/nginx/conf.d/default.conf
      - ./staticfiles:/app/staticfiles:ro
      - ./media:/app/media:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - web
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.hypostasia.tls.certresolver=myresolver"
      - "traefik.http.services.hypostasia.loadbalancer.server.port=80"
      - "traefik.http.routers.hypostasia.rule=Host(`${DOMAIN}`)"
#      - "traefik.http.routers.hypostasia.middlewares=crowdsec@file"
    networks:
      - frontend
      - hypostasia

networks:
  frontend:
    external: true
  hypostasia:

volumes:
  pgdata:
