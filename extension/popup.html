<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <!--
    POPUP DE L'EXTENSION — CHOISIR LE CARNET, PUIS RECOLTER
    / Extension popup — choose the notebook, then harvest

    LOCALISATION : extension/popup.html

    L'ORDRE DES ELEMENTS EST LE SUJET. Le carnet se choisit AVANT le
    bouton : la capture part directement a sa destination, en une seule
    requete. Auparavant la note atterrissait dans le fourre-tout et des
    boutons de rangement apparaissaient apres coup — deux gestes, deux
    aller-retours, et une note deja rangee ailleurs si l'utilisateur
    fermait la popup entre les deux.
    / The notebook is picked BEFORE the button: one request, one
    destination. The old flow filed into the inbox and offered buttons
    afterwards — two gestures, and a misfiled note if the popup closed.

    FLUX : popup.js au chargement
      -> GET /api/pages/me/         (le serveur repond-il, suis-je connecte)
      -> GET /api/pages/mes_carnets/ (remplit #carnetChoisi)
      -> si aucun jeton ne marche : #connecterBtn apparait
         -> clic -> GET /api/pages/mon_jeton/ AVEC les cookies du site
      -> clic #recolterBtn
      -> GET /api/pages/?url=...    (deja capturee ?)
      -> Readability dans l'onglet
      -> POST /api/pages/ { ..., dossier_id }
    -->
    <style>
        /* Tokens de couleur, clair et sombre. La popup a son propre CSS :
           elle ne charge ni Tailwind ni maquette.css, qui vivent sur le
           serveur et ne sont pas accessibles depuis chrome-extension://.
           / The popup carries its own tokens: the server's stylesheets
           are not reachable from a chrome-extension:// page. */
        :root {
            --papier: #fafafa;
            --panneau: #ffffff;
            --encre: #334155;
            --encre-douce: #64748b;
            --bordure: #cbd5e1;
            --accent: #3b82f6;
            --bouton-fond: #2563eb;
            --bouton-fond-survol: #3b82f6;
            --bouton-texte: #ffffff;
            --succes: #15803d;
            --alerte: #b45309;
            --erreur: #dc2626;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --papier: #0f172a;
                --panneau: #1e293b;
                --encre: #e2e8f0;
                --encre-douce: #94a3b8;
                --bordure: #475569;
                --accent: #60a5fa;
                /* Bleu CLAIR et texte SOMBRE, l'inverse du theme clair.
                   Un bouton bleu fonce avec du texte blanc ne donne que
                   3,68:1 sur ce fond — insuffisant pour du texte de
                   13 px, qui n'est pas du « grand texte » au sens WCAG.
                   Ainsi : 7,02:1 pour le texte, et 7,02:1 du bouton sur
                   le fond de la popup, donc un bouton nettement delimite.
                   / Light blue with dark text: the dark-blue-on-white
                   pairing only reaches 3.68:1 here, below AA for 13px. */
                --bouton-fond: #60a5fa;
                --bouton-fond-survol: #93c5fd;
                --bouton-texte: #0f172a;
                --succes: #4ade80;
                --alerte: #fbbf24;
                --erreur: #f87171;
            }
        }

        body {
            width: 260px;
            padding: 10px;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--papier);
            color: var(--encre);
        }

        label {
            display: block;
            font-size: 10px;
            color: var(--encre-douce);
            margin-bottom: 3px;
        }

        #serverUrl, #carnetChoisi {
            width: 100%;
            padding: 5px 8px;
            border: 1px solid var(--bordure);
            border-radius: 4px;
            font-size: 11px;
            color: var(--encre);
            background: var(--panneau);
            box-sizing: border-box;
        }

        #serverUrl:focus, #carnetChoisi:focus, #recolterBtn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        #recolterBtn {
            width: 100%;
            padding: 8px 12px;
            background-color: var(--bouton-fond);
            color: var(--bouton-texte);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }

        #recolterBtn:hover:not(:disabled) { background-color: var(--bouton-fond-survol); }
        #recolterBtn:disabled { background-color: var(--encre-douce); color: var(--papier); cursor: not-allowed; }

        #status {
            margin-top: 6px;
            font-size: 11px;
            color: var(--encre-douce);
            text-align: center;
            min-height: 16px;
        }

        #status.error { color: var(--erreur); }
        #status.success { color: var(--succes); }
        #status.info { color: var(--alerte); }

        #serverStatus {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            color: var(--encre-douce);
            margin-bottom: 4px;
        }

        #serverStatusDot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--encre-douce);
            flex-shrink: 0;
        }

        #serverStatusDot.online { background-color: var(--succes); }
        #serverStatusDot.offline { background-color: var(--erreur); }

        #authStatus {
            font-size: 10px;
            margin-bottom: 6px;
            min-height: 14px;
        }

        #authStatus.auth-ok { color: var(--succes); }
        #authStatus.auth-ko { color: var(--alerte); }

        #connecterBtn {
            width: 100%;
            padding: 6px 10px;
            margin-bottom: 8px;
            background: transparent;
            /* `--bouton-fond` et non `--accent` : en theme clair,
               #3b82f6 sur le fond de la popup ne donne que 3,52:1, sous
               le seuil AA pour du texte de 11 px.
               / Not --accent: it only reaches 3.52:1 in the light theme. */
            color: var(--bouton-fond);
            border: 1px solid var(--bouton-fond);
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
        }

        #connecterBtn:hover:not(:disabled) {
            background: var(--bouton-fond);
            color: var(--bouton-texte);
            border-color: var(--bouton-fond);
        }

        #connecterBtn:disabled { opacity: .6; cursor: not-allowed; }
        #connecterBtn[hidden] { display: none; }

        #zoneCarnet { margin-bottom: 8px; }

        /* L'avertissement de carnet public. Discret par choix : le seul
           carnet inscriptible d'un compte peut etre public, auquel cas
           cette ligne s'afficherait a CHAQUE capture — un avertissement
           permanent n'avertit plus.
           / Deliberately discreet: a user whose only writable notebook is
           public would see it on every capture, and a permanent warning
           stops warning. */
        #carnetAvertissement {
            display: none;
            font-size: 10px;
            color: var(--alerte);
            margin-top: 3px;
        }

        #carnetAvertissement.visible { display: block; }

        /* Le message qui remplace le menu quand il n'y a rien a choisir.
           / The message replacing the dropdown when there is nothing to
           choose. */
        #carnetAucun {
            font-size: 11px;
            color: var(--alerte);
            line-height: 1.4;
        }

        #carnetAucun[hidden] { display: none; }
        #carnetChoisi[hidden] { display: none; }

        .ligne-serveur { display: flex; gap: 4px; margin-bottom: 8px; }

        #saveUrlBtn {
            width: auto;
            padding: 5px 8px;
            font-size: 11px;
            border: none;
            border-radius: 4px;
            background-color: var(--encre-douce);
            /* Meme raison que le bouton principal : du blanc sur ce gris
               ne donne que 2,6:1 en theme sombre.
               / Same reason as the main button: white here is 2.6:1. */
            color: var(--bouton-texte);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="ligne-serveur">
        <label for="serverUrl" class="visually-hidden" style="position:absolute;left:-9999px;">Adresse du serveur Hypostasia</label>
        <input type="text" id="serverUrl" placeholder="https://beta.hypostasia.org/"
               data-testid="extension-url-serveur" style="flex: 1;">
        <button id="saveUrlBtn" data-testid="extension-valider-url">OK</button>
    </div>

    <div id="serverStatus" aria-live="polite">
        <span id="serverStatusDot" aria-hidden="true"></span>
        <span id="serverStatusText">Verification...</span>
    </div>
    <div id="authStatus" aria-live="polite"></div>

    <!--
    CONNEXION EN UN CLIC
    / One-click connection

    Le bouton n'apparait que tant qu'aucun jeton ne fonctionne. Au clic,
    popup.js demande le jeton au serveur AVEC les cookies du navigateur
    (le seul appel qui les envoie), le range, et tout repart par le jeton.
    / Shown only while no token works; popup.js then fetches the token
    using the browser session, stores it, and uses only the token after.
    -->
    <button id="connecterBtn" data-testid="extension-connecter" hidden>
        Connecter cette extension
    </button>

    <div id="zoneCarnet">
        <label for="carnetChoisi">Ranger dans</label>
        <select id="carnetChoisi" data-testid="extension-choix-carnet"
                aria-describedby="carnetAvertissement">
        </select>
        <div id="carnetAvertissement" role="status">
            Ce carnet est public : la note y sera visible par tous.
        </div>
        <div id="carnetAucun" role="status" data-testid="extension-aucun-carnet" hidden>
            Vous n'avez aucun carnet où écrire. Créez-en un sur votre
            instance, puis rouvrez cette fenêtre.
        </div>
    </div>

    <button id="recolterBtn" data-testid="extension-recolter">Recolter</button>
    <div id="status" role="status" aria-live="polite"></div>

    <script src="popup.js"></script>
</body>
</html>
