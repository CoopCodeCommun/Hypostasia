# Nginx pour Hypostasia — configuration DEV
# Tout le trafic (HTTP + WebSocket) est proxie vers le runserver ASGI sur le port 8000.
# Le runserver Django avec daphne en premiere position dans INSTALLED_APPS gere les deux.
#
# Utilisation : definir NGINX_CONF=dev.conf dans .env
# / Nginx for Hypostasia — DEV configuration
# / All traffic (HTTP + WebSocket) is proxied to the ASGI runserver on port 8000.
# / Django runserver with daphne first in INSTALLED_APPS handles both.
#
# / Usage: set NGINX_CONF=dev.conf in .env

server {
    listen 80;
    server_name _;
    client_max_body_size 300M;

    # Fichiers media (documents sources, audio) — SERVIS PAR NGINX, ET
    # NON PROXIES VERS DJANGO. Ajoute le 14 aout 2026.
    #
    # POURQUOI CETTE EXCEPTION DANS UNE CONF QUI PROXIE TOUT
    #
    # En dev, `/media/` tombait dans le `location /` ci-dessous, donc
    # sur `django.views.static.serve`, qui NE GERE PAS les requetes
    # `Range` : il repond 200 avec le fichier ENTIER la ou le navigateur
    # demande un morceau. Consequence, mesuree le 14 aout : cliquer un
    # « play » dans une transcription lancait l'audio DEPUIS LE DEBUT,
    # parce qu'un navigateur ignore SILENCIEUSEMENT un `currentTime`
    # qu'il ne peut pas atteindre.
    #
    # nginx repond `206 Partial Content` nativement. Le deplacement
    # marche donc sans une ligne de JavaScript — une premiere tentative
    # de contournement cote client (rejouer le positionnement, forcer
    # le telechargement complet) avait produit un gresillement audible.
    #
    # C'est aussi ce que fait `default.conf` en production : dev et prod
    # servent desormais les medias de la meme facon, ce qui evite qu'un
    # defaut de ce genre ne se voie que d'un seul cote.
    # / Media served by nginx, not proxied to Django: django.views.static
    # ignores Range and answers 200 with the whole file, so seeking was
    # silently dropped and audio restarted from zero. nginx answers 206
    # natively — and this now matches production.
    location /media/ {
        alias /app/media/;
        access_log off;
    }

    # WebSocket → runserver ASGI (port 8000) — upgrade de protocole HTTP → WS
    # / WebSocket → ASGI runserver (port 8000) — HTTP to WS protocol upgrade
    location /ws/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # HTTP → runserver ASGI (port 8000)
    # / HTTP → ASGI runserver (port 8000)
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
