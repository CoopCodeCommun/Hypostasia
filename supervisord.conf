[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
user=hypostasia

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; AUCUNE COMMANDE NE PASSE PAR `uv run` (14 aout 2026)
;
; `uv run` laisse un process wrapper VIVANT entre supervisord et le
; programme reel (constate : `uv run celery …` en PID 91, le vrai celery
; en PID 99). Supervisord surveillait donc le wrapper : son SIGTERM
; d'arret allait a `uv`, pas au worker — or c'est le worker qui doit le
; recevoir pour finir sa tache en cours (stopwaitsecs ci-dessous). Le
; PATH de l'image contient deja /app/.venv/bin (Dockerfile), le wrapper
; n'apportait rien.
; / No `uv run`: it left a live wrapper between supervisord and the real
; process, so SIGTERM went to the wrapper instead of the worker.

[program:gunicorn]
; Moteur HTTP principal — WSGI multi-processus, stable, haute performance HTTP
; / Main HTTP engine — multi-process WSGI, stable, high HTTP performance
command=gunicorn hypostasia.wsgi:application --bind 0.0.0.0:8001 --workers 4 --capture-output
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:daphne]
; Moteur WebSocket — ASGI event-loop, gere les connexions WS persistantes
; / WebSocket engine — ASGI event-loop, handles persistent WS connections
command=daphne -b 0.0.0.0 -p 8000 hypostasia.asgi:application
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:celery_worker]
command=celery -A hypostasia worker --loglevel=info --concurrency=2
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
stopwaitsecs=60
; SIGKILL de dernier recours au groupe entier : sans cela, un worker
; qui depasse stopwaitsecs est tue seul et laisse ses enfants prefork
; orphelins, avec toute leur memoire. L'arret NORMAL reste un SIGTERM
; au seul parent (pas de stopasgroup) : c'est lui qui orchestre l'arret
; tiede de ses enfants.
; / Last-resort SIGKILL to the whole group, or the prefork children are
; left orphaned with all their memory. Normal stop stays a SIGTERM to
; the parent alone, which runs Celery's warm shutdown.
killasgroup=true

; Worker DEDIE a l'ingestion Docling (relecture BR-B) : concurrence 1,
; une seule conversion a la fois — les modeles Docling sont lourds et le
; serveur 8 Go est partage avec la production. La route est posee dans
; hypostasia/celery.py (task_routes -> queue "ingestion_docling").
; / Dedicated Docling worker: one conversion at a time on the shared host.
[program:celery_worker_docling]
command=celery -A hypostasia worker --loglevel=info --concurrency=1 -Q ingestion_docling -n docling@%%h
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
stopwaitsecs=120
; Meme raison que pour l'autre worker. / Same reason as the other worker.
killasgroup=true

; Worker DEDIE au SECOND AVIS (juge local ShieldStral) : concurrence 1
; et `nice -n 19`, pour que Docling reste prioritaire. Voir
; hypostasia/celery.py (task_routes -> queue "verification_locale") et
; le commentaire detaille de supervisord-dev.conf.
; / Dedicated second-opinion worker, deprioritised so Docling wins.
[program:celery_worker_juge_local]
command=nice -n 19 celery -A hypostasia worker --loglevel=info --concurrency=1 -Q verification_locale -n juge_local@%%h
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
; Un paquet de dix paires dure ~4 min 20 a six threads.
; / A ten-pair packet takes ~4 min 20.
stopwaitsecs=300
killasgroup=true
