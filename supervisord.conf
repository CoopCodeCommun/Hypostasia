[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
user=hypostasia

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:gunicorn]
; Moteur HTTP principal — WSGI multi-processus, stable, haute performance HTTP
; / Main HTTP engine — multi-process WSGI, stable, high HTTP performance
command=uv run gunicorn hypostasia.wsgi:application --bind 0.0.0.0:8001 --workers 4 --capture-output
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:daphne]
; Moteur WebSocket — ASGI event-loop, gere les connexions WS persistantes
; / WebSocket engine — ASGI event-loop, handles persistent WS connections
command=uv run daphne -b 0.0.0.0 -p 8000 hypostasia.asgi:application
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:celery_worker]
command=uv run celery -A hypostasia worker --loglevel=info --concurrency=2
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
stopwaitsecs=60

; Worker DEDIE a l'ingestion Docling (relecture BR-B) : concurrence 1,
; une seule conversion a la fois — les modeles Docling sont lourds et le
; serveur 8 Go est partage avec la production. La route est posee dans
; hypostasia/celery.py (task_routes -> queue "ingestion_docling").
; / Dedicated Docling worker: one conversion at a time on the shared host.
[program:celery_worker_docling]
command=uv run celery -A hypostasia worker --loglevel=info --concurrency=1 -Q ingestion_docling -n docling@%%h
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
stopwaitsecs=120
