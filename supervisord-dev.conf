; =============================================================================
; supervisord-dev.conf — Services de DEVELOPPEMENT Hypostasia
; / Hypostasia DEVELOPMENT services
;
; Pourquoi ce fichier existe (14 aout 2026)
; ----------------------------------------
; Le dev se lancait a la main, un `docker exec` par service. La commande
; du worker Celery avait derive : elle tirait `-Q celery,ingestion_docling`
; a concurrence 2, la ou supervisord.conf declare en prod un worker DEDIE
; a l'ingestion Docling, a concurrence 1. Deux conversions Docling
; pouvaient donc tourner de front en dev — deux chargements de modeles,
; ~83 s et ~2 Go chacun (mesure du 14 aout 2026) — et une ingestion
; pouvait occuper les deux slots, bloquant les analyses.
; / Dev had drifted: one worker pulling both queues at concurrency 2.
;
; Ce fichier remet le dev sur la meme topologie que la prod, et rend le
; lancement reproductible : une commande au lieu de trois.
; / Same topology as production, one command instead of three.
;
; Ce qui DIFFERE de la prod, et pourquoi
; --------------------------------------
;   runserver au lieu de gunicorn + daphne : on veut le rechargement
;   automatique du code. Le runserver de Django sert HTTP *et* WebSocket
;   en ASGI (daphne est en tete d'INSTALLED_APPS), et nginx/dev.conf
;   proxie deja tout vers web:8000 — un seul process suffit donc la ou la
;   prod en a deux.
; / runserver instead of gunicorn+daphne: autoreload, and it serves both
; HTTP and WebSocket in ASGI, which is what nginx/dev.conf expects.
;
; QUI LANCE CE FICHIER
;
; Le conteneur lui-meme : `docker-compose.yml` l'appelle en mode dev,
; apres install.sh. Supervisord est donc le PID 1 du conteneur, comme
; start.sh le fait en prod, et TOUS les journaux sortent sur la sortie
; standard — c'est ce qui rend `docker compose logs -f` utile en
; developpement. Les journaux sont en DEBUG (settings.LOGGING).
; / The container itself launches this file, so supervisord is PID 1 and
; every log goes to stdout, which is what makes `docker compose logs -f`
; useful in development.
;
; USAGE
; -----
;   Tout voir :
;     docker compose logs -f web        (ou : make logs)
;   Etat :
;     make status
;   Redemarrer un service :
;     make restart S=runserver
;
; Sans le Makefile :
;   docker exec hypostasia_web supervisorctl -c /app/supervisord-dev.conf status
;
; Aucune commande ne passe par `uv run` : le PATH de l'image contient
; deja /app/.venv/bin (Dockerfile), et le wrapper `uv` s'interposerait
; entre supervisord et le process reel — le SIGTERM d'arret irait au
; wrapper au lieu d'aller au worker, qui a besoin de le recevoir
; lui-meme pour finir sa tache en cours.
; / No `uv run`: it would put a wrapper between supervisord and the real
; process, and SIGTERM would go to the wrapper instead of the worker.
; =============================================================================

[unix_http_server]
; Socket distincte de celle de la prod, comme le pidfile : deux
; supervisord ne doivent pas se disputer le meme point d'entree, et un
; `supervisorctl` de dev ne doit jamais pouvoir piloter par megarde des
; programmes de prod. / A socket of its own, like the pidfile.
file=/tmp/supervisor-dev.sock

[supervisord]
; PREMIER PLAN, et les journaux sur la sortie standard (correction du
; 15 aout 2026). En demon, avec des journaux dans des fichiers,
; `docker compose logs -f` ne montrait RIEN des trois services : le
; conteneur n'avait sur son stdout que le message d'accueil. Le mode
; dev doit se lire comme la prod — une seule commande pour tout voir,
; et en DEBUG (settings.LOGGING).
; / Foreground, logs to stdout: as a daemon writing to files,
; `docker compose logs -f` showed nothing of the three services.
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord-dev.pid

[supervisorctl]
serverurl=unix:///tmp/supervisor-dev.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:runserver]
; Serveur de dev — ASGI (HTTP + WebSocket), avec rechargement automatique
; / Dev server — ASGI (HTTP + WebSocket), with autoreload
command=python manage.py runserver 0.0.0.0:8000
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
; stderr rabattu sur le meme journal par redirect_stderr, et NON par un
; second stderr_logfile pointant le meme chemin : supervisord ouvrirait
; alors DEUX journaux tournants independants sur un seul fichier, chacun
; avec son descripteur et son compteur. Au premier basculement, l'un
; continue d'ecrire dans l'inode renomme et ses lignes sont perdues.
; / redirect_stderr, never a second stderr_logfile on the same path:
; two independent rotating loggers lose lines at the first rotation.
redirect_stderr=true
; Le rechargement automatique fait tourner DEUX process : le surveillant
; et le serveur. Sans ces deux lignes, l'arret ne tuerait que le
; surveillant et le port 8000 resterait pris.
; / Autoreload runs two processes; without these, the port stays bound.
stopasgroup=true
killasgroup=true

[program:celery_worker]
; File par defaut : analyses, syntheses, transcriptions.
; Aucun `-Q` = la file `celery` seule — surtout PAS `ingestion_docling`,
; qui a son worker dedie ci-dessous.
; / Default queue only. Never ingestion_docling: it has its own worker.
command=celery -A hypostasia worker --loglevel=info --concurrency=2
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
; Meme raison que pour runserver. / Same reason as runserver.
redirect_stderr=true
stopwaitsecs=60
; SIGKILL de dernier recours au groupe entier, pour ne pas laisser
; d'enfant prefork orphelin. L'arret normal, lui, reste un SIGTERM au
; seul parent : c'est lui qui orchestre l'arret propre de ses enfants.
; / Last-resort SIGKILL to the group; normal stop stays a SIGTERM to the
; parent alone, which is what runs Celery's warm shutdown.
killasgroup=true

[program:celery_worker_docling]
; Worker DEDIE a l'ingestion Docling, a concurrence 1 : une seule
; conversion a la fois. Meme topologie qu'en prod (supervisord.conf), et
; c'est ce qui rend exacte la position affichee dans la file d'attente
; (front/views_taches.py) : a concurrence 2, deux pages sortiraient de la
; file en meme temps et le rang annonce serait faux.
; / Dedicated Docling worker at concurrency 1, as in production. It is
; also what makes the queue position shown to users accurate.
command=celery -A hypostasia worker --loglevel=info --concurrency=1 -Q ingestion_docling -n docling@%%h
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
; Meme raison que pour runserver. / Same reason as runserver.
redirect_stderr=true
; Plus long que l'autre worker : une conversion Docling en cours doit
; pouvoir aller au bout (83 s a froid, mesure du 14 aout 2026).
; / Longer than the other worker: a running conversion must finish.
stopwaitsecs=120
killasgroup=true

[program:celery_worker_juge_local]
; Worker DEDIE au SECOND AVIS (juges locaux (quatre encodeurs NLI)), a concurrence 1
; et sous `nice -n 19`. Meme topologie qu'en prod.
;
; POURQUOI CONCURRENCE 1 : l'inference charge 5,13 Go (les quatre encodeurs residents, mesure du 19 aout) et prend six
; threads. Deux en meme temps feraient seize threads sur huit coeurs, et
; Docling mourrait de faim.
;
; POURQUOI `nice -n 19` ET PAS UNE PORTE « attendre que le CPU baisse » :
; une porte affame en silence — sur une machine chargee elle ne s'ouvre
; jamais, et rien ne le dit. `nice` laisse le noyau arbitrer en continu,
; sans scrutation. Baisser sa propre priorite ne demande AUCUNE capacite
; (verifie dans ce conteneur : CapAdd vide, non privilegie), et `nice`
; fait un exec — il ne laisse donc aucun wrapper entre supervisord et le
; worker, contrairement a `uv run` : le SIGTERM d'arret va bien au
; worker.
;
; LA BORNE, A CONNAITRE : le nice n'arbitre qu'A L'INTERIEUR du cgroup
; de ce conteneur. Docling, gunicorn et daphne y vivent — donc la ou ca
; compte. Face a PostgreSQL, Redis ou Traefik, qui sont d'autres
; cgroups, le conteneur pese son poids plein.
; / Dedicated second-opinion worker: concurrency 1 and nice 19. A "wait
; for idle CPU" gate would starve silently; nice lets the kernel
; arbitrate continuously, inside this container's cgroup.
command=nice -n 19 celery -A hypostasia worker --loglevel=info --concurrency=1 -Q verification_locale -n juge_local@%%h
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
; Un paquet de dix paires dure ~5 a 10 s (quatre encodeurs) : l'arret doit
; lui laisser le temps de finir, sinon le paquet est perdu (les taches
; ne sont pas en acks_late). / A ten-pair packet takes ~5-10 s.
stopwaitsecs=300
killasgroup=true

[program:celery_beat]
; LE PLANIFICATEUR — passe de nuit des wikis et recapitulatif du matin
; (hypostasia/celery.py, `beat_schedule`). Meme topologie qu'en prod.
;
; IL NE CONSOMME AUCUNE FILE : il n'envoie que des messages, il ne prend
; aucun slot d'execution. Les trois workers restent les trois workers.
;
; EN DEV, IL DECLENCHE DE VRAIS APPELS FACTURES a l'heure dite. Pour
; travailler sans qu'il parte tout seul :
;     make restart S=celery_beat   (le relance)
;     docker exec hypostasia_web supervisorctl -c /app/supervisord-dev.conf stop celery_beat
; / In dev it fires real, billed calls at the scheduled hour.
command=celery -A hypostasia beat --loglevel=info --schedule=/tmp/celerybeat-schedule
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
stopwaitsecs=30
killasgroup=true
