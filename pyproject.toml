[project]
name = "v3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6",
    "django-cors-headers>=4.9.0",
    "django-htmx>=1.27.0",
    "djangorestframework>=3.16.1",
    "google-generativeai>=0.8.5",
    "ipdb>=0.13.13",
    "openai>=2.9.0",
    "gunicorn>=21.2.0",
    "djangorestframework-stubs>=3.16.6",
    # 1.6.0 minimum : c'est la version qui accepte une liste JSON NUE
    # (`[...]` au lieu de `{"extractions": [...]}`). En 1.1.1 le
    # `FormatHandler` levait, et notre `suppress_parse_errors=True`
    # transformait l'exception en ZERO extraction, en silence.
    # / 1.6.0 accepts a bare top-level JSON list; 1.1.1 raised, and
    #   suppress_parse_errors turned that into a silent empty result.
    "langextract>=1.6.0",
    "bleach>=6.3.0",
    "django-solo>=2.5.1",
    "markitdown[all]>=0.1.0",
    "mammoth>=1.8.0",
    "mistune>=3.1.0",
    "celery>=5.4",
    "django-celery-results>=2.5",
    "mistralai>=1.0",
    "supervisor>=4.2",
    "tiktoken>=0.12.0",
    "mutagen>=1.47.0",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "playwright>=1.50",
    "anthropic>=0.40",
    "channels>=4.0",
    "daphne>=4.0",
    "channels-redis>=4.1",
    "stripe>=8.0",
    "markdown>=3.10.2",
    "docling>=2.118.0",
    # Pillow est requis par `ImageField` (BaseDeConnaissances.image_de_couverture,
    # 12 aout 2026) : sans lui, Django refuse de demarrer sur `fields.E210`,
    # avant meme la premiere requete. Il etait deja installe, mais SEULEMENT
    # comme dependance transitive de docling-parse, pdfplumber et python-pptx.
    # Retirer ou alleger l'un d'eux aurait casse le demarrage sans qu'aucun
    # fichier du projet ne mentionne la cause.
    # / Pillow is required by ImageField; Django refuses to start without it.
    # It was present only transitively via docling-parse, pdfplumber and
    # python-pptx: dropping any of them would have broken startup silently.
    "pillow>=11.0",
    # LES QUATRE JUGES LOCAUX, ET LA MEME LECON QUE PILLOW JUSTE AU-DESSUS.
    #
    # `transformers` et `sentencepiece` sont utilises DIRECTEMENT par
    # `core/services/juges_locaux.py`, mais n'arrivaient ici que par
    # `docling`. Alleger Docling les aurait fait disparaitre, et la panne
    # n'aurait nomme ni sa cause ni son declencheur.
    #
    # `sentencepiece` n'etait meme pas la : il vivait dans
    # `/tmp/banc_deps`, atteint par un `PYTHONPATH` que le worker ne
    # portait pas. `distilcamembert` — dont le depot n'a PAS de
    # `tokenizer.json` — levait donc `ModuleNotFoundError` a chaque
    # paquet, notait zero paire, et la garde `arret_sans_progres`
    # stoppait TOUTE la campagne, y compris pour les trois juges sains.
    # Le dossier annoncait quatre juges ; il en tournait trois.
    # / transformers and sentencepiece are used directly by the local
    #   judges but only arrived transitively via docling. sentencepiece
    #   was not even in the venv: the fourth judge never scored anything,
    #   and its failure stopped the whole campaign.
    # PAS DE BORNE DE VERSION SUR `transformers` : Docling en pose une
    # haute (`<5.9` sur certaines plateformes) et une borne basse d'ici
    # rendrait la resolution IMPOSSIBLE pour tout environnement autre que
    # le notre. On declare l'USAGE DIRECT, on laisse Docling arbitrer la
    # version. / No version bound: docling caps it, and pinning here
    # makes the resolution unsatisfiable on other platforms.
    "transformers",
    "sentencepiece>=0.2",
]
